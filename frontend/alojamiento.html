<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publicar alojamiento · Upland</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <nav id="nav" class="nav" aria-label="Principal"></nav>
  </header>

  <main class="contenedor contenedor-medio">
    <h1 id="encabezado">Publicar alojamiento</h1>
    <div id="error" class="error" role="alert" hidden></div>

    <form id="formulario" class="formulario">
      <div class="campo">
        <label for="titulo">Título</label>
        <input id="titulo" name="titulo" type="text" maxlength="150" required>
      </div>
      <div class="campo">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="5" maxlength="5000" required></textarea>
      </div>
      <div class="campos-en-fila">
        <div class="campo">
          <label for="ciudad">Ciudad</label>
          <input id="ciudad" name="ciudad" type="text" maxlength="100" required>
        </div>
        <div class="campo">
          <label for="direccion">Dirección</label>
          <input id="direccion" name="direccion" type="text" maxlength="255" required>
        </div>
      </div>
      <div class="campos-en-fila">
        <div class="campo">
          <label for="capacidad">Capacidad (huéspedes)</label>
          <input id="capacidad" name="capacidad" type="number" min="1" step="1" required>
        </div>
        <div class="campo">
          <label for="precioNoche">Precio por noche (COP)</label>
          <input id="precioNoche" name="precioNoche" type="number" min="1" step="0.01" required>
        </div>
      </div>
      <div class="campos-en-fila">
        <div class="campo">
          <label for="latitud">Latitud (opcional)</label>
          <input id="latitud" name="latitud" type="number" min="-90" max="90" step="any">
        </div>
        <div class="campo">
          <label for="longitud">Longitud (opcional)</label>
          <input id="longitud" name="longitud" type="number" min="-180" max="180" step="any">
        </div>
      </div>
      <button id="enviar" type="submit" class="boton">Publicar</button>
    </form>

    <p class="pie-formulario"><a href="panel.html">Volver a mi panel</a></p>
  </main>

  <script type="module" src="js/alojamiento.js"></script>
</body>
</html>
