<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upland · Alojamientos en Santander</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <nav id="nav" class="nav" aria-label="Principal"></nav>
  </header>

  <main class="contenedor">
    <h1>Alojamientos en Santander</h1>

    <form id="filtros" class="filtros" role="search">
      <div class="campo">
        <label for="ciudad">Ciudad</label>
        <select id="ciudad" name="ciudad">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="campo">
        <label for="huespedes">Huéspedes</label>
        <input id="huespedes" name="huespedes" type="number" min="1" placeholder="Cualquiera">
      </div>
      <div class="campo">
        <label for="precioMax">Precio máximo</label>
        <input id="precioMax" name="precioMax" type="number" min="1" step="1000" placeholder="Por noche">
      </div>
      <div class="campo">
        <label for="entrada">Entrada</label>
        <input id="entrada" name="entrada" type="date">
      </div>
      <div class="campo">
        <label for="salida">Salida</label>
        <input id="salida" name="salida" type="date">
      </div>
      <div class="filtros-acciones">
        <button type="submit" class="boton">Buscar</button>
        <button id="limpiar" type="button" class="boton boton-secundario">Limpiar</button>
      </div>
    </form>

    <p id="resumen" class="suave resumen"></p>
    <div id="error" class="error" role="alert" hidden></div>
    <p id="vacio" class="suave" hidden></p>

    <section id="catalogo" class="rejilla" aria-label="Catálogo"></section>

    <div class="paginacion">
      <button id="anterior" type="button" class="boton boton-secundario" disabled>Anterior</button>
      <span id="pagina-actual" class="suave"></span>
      <button id="siguiente" type="button" class="boton boton-secundario" disabled>Siguiente</button>
    </div>
  </main>

  <template id="plantilla-tarjeta">
    <a class="tarjeta">
      <p class="tarjeta-ciudad"></p>
      <h2 class="tarjeta-titulo"></h2>
      <p class="suave tarjeta-capacidad"></p>
      <p class="tarjeta-precio"></p>
    </a>
  </template>

  <script type="module" src="js/index.js"></script>
</body>
</html>
