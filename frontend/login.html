<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Upland</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <nav id="nav" class="nav" aria-label="Principal"></nav>
  </header>

  <main class="contenedor contenedor-angosto">
    <h1>Iniciar sesión</h1>
    <div id="aviso" class="aviso" hidden></div>
    <div id="error" class="error" role="alert" hidden></div>

    <form id="formulario" class="formulario">
      <div class="campo">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="enviar" type="submit" class="boton">Entrar</button>
    </form>

    <p class="pie-formulario">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
