spring:
  application:
    name: upland

  # Los valores por defecto coinciden con docker-compose.yml y sirven solo para desarrollo
  # local. En cualquier otro entorno se sobrescriben con variables de entorno.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/upland}
    username: ${DB_USER:upland}
    password: ${DB_PASSWORD:upland}

  jpa:
    hibernate:
      # El esquema lo define Flyway. Hibernate solo comprueba que las entidades coincidan
      # con las tablas, y el arranque falla si no coinciden.
      ddl-auto: validate
    # La API devuelve DTOs armados en el servicio, así que no hace falta mantener la sesión
    # de Hibernate abierta mientras se serializa la respuesta.
    open-in-view: false

  # Las credenciales se verifican en UsuarioService. Sin esta exclusión Spring Boot crea un
  # usuario "user" en memoria e imprime una contraseña generada en cada arranque.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

upland:
  jwt:
    # HS256 exige al menos 32 bytes. El valor por defecto es solo para desarrollo local.
    secret: ${JWT_SECRET:solo-desarrollo-local-cambiar-en-cualquier-otro-entorno}
    expiracion: ${JWT_EXPIRACION:1h}
  cors:
    # Orígenes del frontend, separados por coma. localhost y 127.0.0.1 son orígenes
    # distintos para el navegador, y Live Server abre el segundo por defecto.
    origenes-permitidos: ${CORS_ORIGENES:http://localhost:5500,http://127.0.0.1:5500}
